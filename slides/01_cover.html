<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나의 커리어 로드맵 - 표지</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div class="slide-container" style="background-color: var(--bg-color);">
    
    <!-- Background Decoration Grid Pattern -->
    <div data-object="true" data-object-type="shape" style="position: absolute; left: 0px; top: 0px; width: 1920px; height: 1080px; z-index: 1; opacity: 0.15; pointer-events: none; background-image: radial-gradient(var(--primary) 1.5px, transparent 1.5px); background-size: 40px 40px;"></div>

    <!-- Diagonal Soft Blue Gradient Graphic for background depth -->
    <div data-object="true" data-object-type="shape" style="position: absolute; left: 1000px; top: -200px; width: 1100px; height: 1100px; border-radius: 50%; background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, transparent 70%); z-index: 2;"></div>

    <!-- Main Title Card Group (Asymmetric Left Heavy Layout) -->
    <div data-object="true" data-object-type="shape" class="roadmap-card" style="position: absolute; left: 120px; top: 180px; width: 900px; height: 720px; z-index: 10; padding: 60px; display: flex; flex-direction: column; justify-content: space-between; border-left: 10px solid var(--primary); box-shadow: var(--shadow-lg);">
      <div>
        <!-- Affiliation Tag -->
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 30px;">
          <span style="background-color: var(--primary); color: white; padding: 8px 18px; border-radius: 30px; font-weight: 700; font-size: 18px;">소속</span>
          <span style="font-size: 22px; font-weight: 600; color: var(--text-muted);">강원대학교 원주캠퍼스 간호학과 1학년</span>
        </div>

        <!-- Yellow Accent Bar -->
        <div class="accent-bar" style="width: 100px; height: 10px; background-color: var(--highlight); margin-bottom: 25px; border-radius: 5px;"></div>

        <!-- Main Heading -->
        <h1 style="font-size: 80px; font-weight: 900; color: var(--primary); margin: 0 0 15px 0; line-height: 1.15; letter-spacing: -0.03em;">나의 커리어 로드맵</h1>
        <!-- Subheading -->
        <p style="font-size: 38px; font-weight: 500; color: var(--accent); margin: 0 0 40px 0; letter-spacing: -0.01em;">검사 결과에서 실행 계획까지</p>
      </div>

      <!-- Presenter Name & Vision Footer within the card -->
      <div style="border-top: 2px solid #E2E8F0; padding-top: 40px;">
        <div style="font-size: 28px; font-weight: 800; color: var(--text-dark); margin-bottom: 12px;">
          발표자 <span class="text-highlight" style="font-size: 32px; border-bottom: 3px solid var(--highlight);">김종민</span>
        </div>
        <p style="font-size: 24px; font-weight: 600; color: var(--text-muted); margin: 0; display: flex; align-items: center; gap: 10px;">
          <span style="color: var(--highlight); font-size: 30px;">★</span> "환자의 골든타임을 지키는 응급실 간호사를 향하여"
        </p>
      </div>
    </div>

    <!-- Right Side Hero Roadmap/Compass Visual Card -->
    <div data-object="true" data-object-type="shape" class="roadmap-card" style="position: absolute; left: 1080px; top: 180px; width: 720px; height: 720px; z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, var(--primary) 0%, #111827 100%); border: none;">
      
      <!-- Compass / Roadmap Modern Styled SVG Emblem -->
      <div style="position: relative; width: 360px; height: 360px; display: flex; justify-content: center; align-items: center;">
        <!-- Background outer rings -->
        <div style="position: absolute; width: 360px; height: 360px; border-radius: 50%; border: 4px dashed rgba(251, 191, 36, 0.4); animation: rotate 40s linear infinite;"></div>
        <div style="position: absolute; width: 300px; height: 300px; border-radius: 50%; border: 2px solid rgba(59, 130, 246, 0.3);"></div>
        <div style="position: absolute; width: 220px; height: 220px; border-radius: 50%; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);">
          
          <!-- Flat Navigation Compass SVG Icon -->
          <svg width="120" height="120" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16.24 7.75999L14.12 14.12L7.75999 16.24L9.87999 9.87999L16.24 7.75999Z" fill="#3B82F6" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="1" fill="#FBBF24"/>
          </svg>
        </div>
      </div>

      <!-- Modern Card Caption -->
      <div style="margin-top: 40px; text-align: center;">
        <span style="color: var(--highlight); font-size: 16px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase;">CAREER PATHFINDER</span>
        <h3 style="color: white; font-size: 32px; font-weight: 800; margin: 10px 0 5px 0;">간호학의 바다를 항해하는 나침반</h3>
        <p style="color: rgba(248, 250, 252, 0.7); font-size: 20px; margin: 0;">체계적인 4개년 실행 계획과 비전</p>
      </div>

    </div>

  </div>
  <style>
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
