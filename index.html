<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 커리어 로드맵 — 김종민</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

    :root {
      --primary: #1E3A8A;
      --accent:  #3B82F6;
      --highlight: #FBBF24;
      --bg:      #0A0F1E;
      --bar-bg:  rgba(10, 15, 30, 0.95);
      --font:    'Pretendard', -apple-system, system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: #F8FAFC;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* ═══════════════ TOP BAR ═══════════════ */
    #topbar {
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 52px;
      background: var(--bar-bg);
      border-bottom: 1px solid rgba(59,130,246,0.15);
      flex-shrink: 0;
      gap: 12px;
      z-index: 100;
      transition: opacity 0.4s, transform 0.4s;
    }

    .title-text {
      font-size: 14px;
      font-weight: 700;
      color: #F8FAFC;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .title-text span { color: var(--highlight); }

    #thumb-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
      justify-content: center;
    }
    #thumb-strip::-webkit-scrollbar { display: none; }

    .thumb-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.2s;
    }
    .thumb-dot.active { background: var(--highlight); transform: scale(1.45); }
    .thumb-dot:hover:not(.active) { background: rgba(255,255,255,0.5); }

    #slide-counter {
      font-size: 12px;
      font-weight: 600;
      color: rgba(248,250,252,0.45);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* icon buttons in topbar */
    .icon-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: rgba(248,250,252,0.75);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: rgba(59,130,246,0.25); color: #fff; }
    .icon-btn.active { background: rgba(59,130,246,0.35); color: var(--accent); border-color: rgba(59,130,246,0.4); }
    .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ═══════════════ MAIN LAYOUT ═══════════════ */
    #main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* ═══════════════ STAGE ═══════════════ */
    #stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    #slide-wrapper {
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
      border-radius: 3px;
      overflow: hidden;
    }

    #slide-frame {
      width: 1920px; height: 1080px;
      border: none; display: block;
      transform-origin: top left;
    }

    #fade-overlay {
      position: absolute; inset: 0;
      background: #050810;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
      z-index: 10;
    }
    #fade-overlay.fading { opacity: 1; }

    /* nav arrows */
    .nav-btn {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 50px; height: 50px;
      border-radius: 50%;
      border: none;
      background: rgba(30,58,138,0.7);
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px);
      transition: background 0.2s, opacity 0.2s;
      z-index: 20;
      opacity: 0.5;
    }
    .nav-btn:hover { background: var(--primary); opacity: 1; }
    .nav-btn:disabled { opacity: 0.12; cursor: default; }
    #btn-prev { left: 14px; }
    #btn-next { right: 14px; }

    /* keyboard hint */
    #hint {
      position: absolute;
      bottom: 52px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: rgba(255,255,255,0.6);
      font-size: 11px;
      padding: 5px 14px;
      border-radius: 30px;
      pointer-events: none;
      opacity: 1;
      transition: opacity 1s ease;
      z-index: 30;
      white-space: nowrap;
    }
    #hint.hidden { opacity: 0; }

    /* ═══════════════ SCRIPT PANEL ═══════════════ */
    #script-panel {
      width: 0;
      min-width: 0;
      background: #0D1526;
      border-left: 1px solid rgba(59,130,246,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.3s;
      flex-shrink: 0;
      z-index: 50;
    }
    #script-panel.open {
      width: 400px;
      min-width: 400px;
    }

    #script-inner {
      width: 400px;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    #script-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid rgba(59,130,246,0.1);
      flex-shrink: 0;
    }
    .script-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: var(--accent);
      background: rgba(59,130,246,0.12);
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    #script-title {
      font-size: 17px;
      font-weight: 800;
      color: #F8FAFC;
      line-height: 1.3;
    }

    #script-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      scrollbar-width: thin;
      scrollbar-color: rgba(59,130,246,0.3) transparent;
    }
    #script-body::-webkit-scrollbar { width: 4px; }
    #script-body::-webkit-scrollbar-thumb { background: rgba(59,130,246,0.3); border-radius: 2px; }

    .script-text {
      font-size: 15px;
      font-weight: 500;
      color: rgba(248,250,252,0.82);
      line-height: 1.85;
      white-space: pre-wrap;
      word-break: keep-all;
    }
    .script-text strong {
      color: var(--highlight);
      font-weight: 700;
    }
    .script-text em {
      color: #93C5FD;
      font-style: normal;
      font-weight: 600;
    }

    .script-cue {
      display: inline-block;
      background: rgba(251,191,36,0.15);
      color: var(--highlight);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      margin: 2px 0;
    }

    #script-footer {
      padding: 14px 20px;
      border-top: 1px solid rgba(59,130,246,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .script-nav-btn {
      font-size: 12px;
      font-weight: 700;
      color: rgba(248,250,252,0.5);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .script-nav-btn:hover { background: rgba(59,130,246,0.2); color: #fff; }
    .script-nav-btn:disabled { opacity: 0.2; cursor: default; }
    #script-counter { font-size: 12px; color: rgba(248,250,252,0.35); }

    /* ═══════════════ BOTTOM BAR ═══════════════ */
    #bottombar {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: var(--bar-bg);
      border-top: 1px solid rgba(59,130,246,0.08);
      flex-shrink: 0;
      z-index: 100;
      overflow-x: auto;
      scrollbar-width: none;
      transition: opacity 0.4s, transform 0.4s;
      padding: 0 8px;
    }
    #bottombar::-webkit-scrollbar { display: none; }

    .slide-label {
      font-size: 11px;
      color: rgba(248,250,252,0.3);
      cursor: pointer;
      padding: 4px 9px;
      border-radius: 20px;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .slide-label.active {
      background: rgba(59,130,246,0.2);
      color: var(--accent);
      font-weight: 700;
    }
    .slide-label:hover:not(.active) { color: #F8FAFC; }

    /* ═══════════════ FULLSCREEN MODE ═══════════════ */
    body.fs-mode #topbar,
    body.fs-mode #bottombar {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-100%);
    }
    body.fs-mode #bottombar {
      transform: translateY(100%);
    }
    body.fs-mode #script-panel { display: none; }
    body.fs-mode .nav-btn { opacity: 0; transition: opacity 0.3s; }
    body.fs-mode #stage:hover .nav-btn:not(:disabled) { opacity: 0.7; }

    /* show a minimal counter in fullscreen */
    #fs-counter {
      position: fixed;
      bottom: 18px;
      right: 22px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      z-index: 200;
      display: none;
      pointer-events: none;
    }
    body.fs-mode #fs-counter { display: block; }
  </style>
</head>

저는 <strong>종합병원 응급실에서 3년차 간호사</strong>로 일하고 싶습니다. 빠른 의사결정과 책임감 있는 태도로, 환자의 생명이 결정되는 가장 치열한 공간에서 <em>골든타임을 수호하는 보건의료인</em>이 되어 있을 것입니다.

응급 임상 스페셜리스트로 성장하면서, 동시에 후배 간호사를 교육하는 리더로서의 역할도 기대하고 있습니다.

더 나아가, 국내에서 쌓은 탄탄한 임상 경력을 바탕으로 <strong>NCLEX-RN을 취득</strong>해 해외 글로벌 무대에서도 환자를 돌볼 수 있는 가능성을 열어 두겠습니다.

국내 트랙과 글로벌 트랙, 두 방향 모두를 바라보며 성장해 나가겠습니다.`,
      },
      {
        title: '07 이번 학기 실행 서약',
        text: `계획은 실천으로 증명됩니다.

저는 이번 학기 안에 반드시 두 가지를 실행하겠습니다.

<strong>① 이번 달 안에 봉사활동 신청</strong>
1365 자원봉사 포털 또는 지역 의료기관 연계 사이트를 통해 방학 봉사 스케줄을 즉시 확보할 것입니다.

<strong>② 매주 일요일 저녁, 2시간 전공 복습</strong>
도서관이나 집중 공간을 미리 세팅하고, 플래너 체크와 성찰 일기를 통해 스스로 동기를 유지하겠습니다.

<em>위대한 간호사의 여정은 오늘 이 작은 약속 하나에서 시작된다고 믿습니다.</em>`,
      },
      {
        title: '08 마무리',
        text: `<strong>"로드맵은 완벽한 지도가 아니라, 항해를 시작할 용기다."</strong>

이 말을 발표를 준비하며 계속 되새겼습니다. 완벽한 계획보다 시작하는 용기가 더 중요합니다.

강원대학교 간호학과에 입학한 것이 저의 첫 번째 용기 있는 선택이었다면, 오늘 이 발표가 그 항해의 두 번째 출발점이 되길 바랍니다.

경청해 주셔서 <em>진심으로 감사합니다.</em>`,
      },
    ];

    /* ─── State ─── */
    let current      = 0;
    let transitioning = false;
    let scriptOpen   = false;

    /* ─── DOM refs ─── */
    const frame       = document.getElementById('slide-frame');
    const wrapper     = document.getElementById('slide-wrapper');
    const overlay     = document.getElementById('fade-overlay');
    const counter     = document.getElementById('slide-counter');
    const thumbStrip  = document.getElementById('thumb-strip');
    const bottombar   = document.getElementById('bottombar');
    const btnPrev     = document.getElementById('btn-prev');
    const btnNext     = document.getElementById('btn-next');
    const hint        = document.getElementById('hint');
    const btnFs       = document.getElementById('btn-fs');
    const iconExpand  = document.getElementById('icon-expand');
    const iconCompress= document.getElementById('icon-compress');
    const btnScript   = document.getElementById('btn-script');
    const scriptPanel = document.getElementById('script-panel');
    const scriptTitle = document.getElementById('script-title');
    const scriptContent = document.getElementById('script-content');
    const scriptCounter = document.getElementById('script-counter');
    const spPrev      = document.getElementById('sp-prev');
    const spNext      = document.getElementById('sp-next');
    const fsCounter   = document.getElementById('fs-counter');

    /* ─── Build dots & labels ─── */
    SLIDES.forEach((s, i) => {
      const dot = document.createElement('div');
      dot.className = 'thumb-dot' + (i === 0 ? ' active' : '');
      dot.title = s.label;
      dot.addEventListener('click', () => goTo(i));
      thumbStrip.appendChild(dot);

      const lbl = document.createElement('div');
      lbl.className = 'slide-label' + (i === 0 ? ' active' : '');
      lbl.textContent = s.label;
      lbl.addEventListener('click', () => goTo(i));
      bottombar.appendChild(lbl);
    });

    /* ─── Update UI ─── */
    function updateUI() {
      const n = SLIDES.length;
      counter.textContent     = `${current + 1} / ${n}`;
      fsCounter.textContent   = `${current + 1} / ${n}`;
      scriptCounter.textContent = `${current + 1} / ${n}`;
      btnPrev.disabled = current === 0;
      btnNext.disabled = current === n - 1;
      spPrev.disabled  = current === 0;
      spNext.disabled  = current === n - 1;

      document.querySelectorAll('.thumb-dot').forEach((d, i) =>
        d.classList.toggle('active', i === current));
      document.querySelectorAll('.slide-label').forEach((l, i) =>
        l.classList.toggle('active', i === current));

      // Update script panel content
      const s = SCRIPTS[current];
      scriptTitle.textContent   = s.title;
      scriptContent.innerHTML   = s.text;
      document.getElementById('script-body').scrollTop = 0;
    }

    /* ─── Navigate ─── */
    function goTo(index) {
      if (transitioning || index === current || index < 0 || index >= SLIDES.length) return;
      transitioning = true;
      overlay.classList.add('fading');

      setTimeout(() => {
        current = index;
        frame.src = SLIDES[current].src;
        updateUI();

        const done = () => {
          overlay.classList.remove('fading');
          transitioning = false;
          frame.onload = null;
        };
        frame.onload = done;
        setTimeout(done, 650);
      }, 220);
    }

    btnPrev.addEventListener('click', () => goTo(current - 1));
    btnNext.addEventListener('click', () => goTo(current + 1));
    spPrev.addEventListener('click',  () => goTo(current - 1));
    spNext.addEventListener('click',  () => goTo(current + 1));

    /* ─── Script panel toggle ─── */
    function toggleScript() {
      scriptOpen = !scriptOpen;
      scriptPanel.classList.toggle('open', scriptOpen);
      btnScript.classList.toggle('active', scriptOpen);
      setTimeout(resize, 310); // resize after animation
    }
    btnScript.addEventListener('click', toggleScript);

    /* ─── Fullscreen ─── */
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }
    btnFs.addEventListener('click', toggleFullscreen);

    document.addEventListener('fullscreenchange', () => {
      const fs = !!document.fullscreenElement;
      document.body.classList.toggle('fs-mode', fs);
      iconExpand.style.display   = fs ? 'none'  : '';
      iconCompress.style.display = fs ? ''      : 'none';
      btnFs.classList.toggle('active', fs);
      resize();
    });

    /* ─── Keyboard ─── */
    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;

      switch (e.key) {
        case 'ArrowRight':
        case ' ':
          e.preventDefault(); goTo(current + 1); break;
        case 'ArrowLeft':
          e.preventDefault(); goTo(current - 1); break;
        case 'f':
        case 'F':
          e.preventDefault(); toggleFullscreen(); break;
        case 's':
        case 'S':
          e.preventDefault(); toggleScript(); break;
        case 'Escape':
          if (document.fullscreenElement) { /* browser handles */ }
          else if (scriptOpen) toggleScript();
          break;
      }
    });

    /* ─── Resize ─── */
    function resize() {
      const panelW  = scriptOpen && !document.body.classList.contains('fs-mode') ? 400 : 0;
      const stageW  = window.innerWidth - panelW;
      const barH    = document.body.classList.contains('fs-mode') ? 0 : 52 + 42;
      const stageH  = window.innerHeight - barH;

      const scaleX  = stageW / 1920;
      const scaleY  = stageH / 1080;
      const scale   = Math.min(scaleX, scaleY) * 0.97;

      frame.style.transform  = `scale(${scale})`;
      wrapper.style.width    = `${1920 * scale}px`;
      wrapper.style.height   = `${1080 * scale}px`;
    }

    window.addEventListener('resize', resize);
    resize();
    updateUI();

    setTimeout(() => hint.classList.add('hidden'), 5000);
  </script>
</body>
